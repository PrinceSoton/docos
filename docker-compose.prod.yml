services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: docos_app:prod
    restart: unless-stopped
    env_file:
      - .env.prod
    expose:
      - "80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://docos.local
    volumes:
      - ./storage:/var/www/html/storage:rw
      - ./bootstrap/cache:/var/www/html/bootstrap/cache:rw
    depends_on:
      db:
        condition: service_healthy
    networks:
      - docos-net
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docos.rule=Host(`docos.local`)"
      - "traefik.http.routers.docos.entrypoints=web"
      - "traefik.http.services.docos.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    dns:
      - 8.8.8.8
      - 1.1.1.1

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docos-net

volumes:
  db_data:
    driver: local

networks:
  docos-net:
    driver: bridge
  proxy-net:
    external: true
